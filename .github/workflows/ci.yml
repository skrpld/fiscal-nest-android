name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v4

      - name: Engine and domain tests
        run: ./gradlew :core:test :domain:test

      - name: App unit tests (JVM and Robolectric)
        run: ./gradlew :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            core/build/reports/
            domain/build/reports/
            app/build/reports/
          retention-days: 14

  apk:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FISCAL_NEST_KEYSTORE_BASE64: ${{ secrets.FISCAL_NEST_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release signing
        if: env.FISCAL_NEST_KEYSTORE_BASE64 != ''
        run: |
          echo "$FISCAL_NEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "FISCAL_NEST_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble debug and release APKs
        env:
          FISCAL_NEST_KEYSTORE_PASSWORD: ${{ secrets.FISCAL_NEST_KEYSTORE_PASSWORD }}
          FISCAL_NEST_KEY_ALIAS: ${{ secrets.FISCAL_NEST_KEY_ALIAS }}
          FISCAL_NEST_KEY_PASSWORD: ${{ secrets.FISCAL_NEST_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease -Pfiscalnest.versionCode=${{ github.run_number }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: fiscal-nest-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
